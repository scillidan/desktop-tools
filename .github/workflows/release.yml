name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "dist/desktop-tools-$version-win64.zip"
          if (-not (Test-Path -LiteralPath $zip)) {
              throw "Tag version $version does not match the packaged workspace version"
          }
          gh release create "$env:GITHUB_REF_NAME" $zip "$zip.sha256" --title "$env:GITHUB_REF_NAME" --generate-notes
