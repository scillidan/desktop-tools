# keyboard-switch — cycle installed keyboard layouts with CapsLock by default.
# InAll uses GetKeyboardLayoutList; InDefine uses the [[layout]] entries below.
# Omitted settings inherit this reference when using the layered config loader.

[settings]
switch_mode = "InAll"
switch_hotkey = "capslock" # Plain CapsLock is swallowed while configured.
swap_esc_caps = false

# InDefine example. Every KLID must name an installed keyboard layout.
# [[layout]]
# klid = "00000409"
# shortcut = "1"
#
# [[layout]]
# klid = "00000804"
# shortcut = "2"
