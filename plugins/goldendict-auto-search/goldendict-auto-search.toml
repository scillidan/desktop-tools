# GoldenDict Auto-search: mouse-triggered dictionary search.
# Set executable to your GoldenDict path if it is not on PATH.
# Empty groups search all dictionaries; set them to your own group names to narrow results.

[goldendict]
executable = "goldendict"
double_click_group = ""
clipboard_group = ""
clipboard_hotkey_enabled = false

[settings]
double_click_enabled = true
clipboard_enabled = false

[hotkeys]
toggle_key = "^!+g"
