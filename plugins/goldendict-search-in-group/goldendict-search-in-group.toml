# goldendict-search-in-group — press a group hotkey to look up the current
# clipboard text in GoldenDict restricted to that dictionary group.
# Create dictionary groups in GoldenDict first, then enter their exact names here.

[goldendict]
# GoldenDict executable (searched via PATH if it has no directory part).
executable = "goldendict"
# true  -> use --popup-group-name (small popup window)
# false -> use --group-name (main window)
clipboard_hotkey_enabled = false

[messages]
no_selection = "No text copied. Please select the word to query first."

# Up to 10 groups, each with a hotkey such as "alt+shift+z". Empty names are ignored.
# Multi-step: "ctrl+alt+x > ctrl+alt+x > alt+g", with at most 400 ms between
# steps. Every step needs Ctrl, Alt or Win. Auto-repeat never advances a step.
# One combo cannot be both a single action and any step of a sequence.
[[group]]
name = ""
hotkey = ""

# [[group]]
# name = "default"
# hotkey = "alt+shift+z"

# [[group]]
# name = "translate"
# hotkey = "alt+shift+x"
