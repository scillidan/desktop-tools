# Windows shell keys owned by keyboard-keymap, not window-tools.
[shell]
suppress = [
    "win+shift+=",
    "win+-",
    "win+esc",
    "win+ctrl+enter",
    "win+ctrl+n",
    "win+ctrl+c",
    "win+g",
    "win+alt+r",
    "win+alt+g",
    "win+alt+m",
    "win+alt+prtscn",
    "win+h",
    "win+v",
    "win+.",
    "win+;",
    "win+w",
    "win+c",
    "win+p",
    "win+k",
    "win+f",
    "win+pause",
    "win+u",
    "win+1",
    "win+2",
    "win+3",
    "win+4",
    "win+5",
    "win+6",
    "win+7",
    "win+8",
    "win+9",
    "win+0",
    "win+shift+0",
    "win+ctrl+1",
    "win+ctrl+2",
    "win+ctrl+3",
    "win+ctrl+4",
    "win+ctrl+5",
    "win+ctrl+6",
    "win+ctrl+7",
    "win+ctrl+8",
    "win+ctrl+9",
    "win+ctrl+0",
    "win+t",
    "win+b",
    "win+left",
    "win+right",
    "win+up",
    "win+down",
    "win+shift+left",
    "win+shift+right",
    "win+shift+up",
    "win+shift+down",
    "win+m",
    "win+shift+m",
    "win+home",
    "win+z",
    "win+ctrl+d",
    "win+ctrl+f4",
    "win+ctrl+left",
    "win+ctrl+right",
    "win+e",
    "win+i",
    "win+s",
    "win+x",
    "win+shift+s",
    "win+prtscn",
]
