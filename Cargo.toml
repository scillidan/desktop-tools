[workspace]
resolver = "2"
members = [
  "crates/*",
  "apps/*",
  "plugins/*",
  "domains/window/window-core",
  "domains/window/window-resize",
  "domains/window/window-mouse-drag",
  "domains/window/window-on-top-bottom",
  "domains/window/window-maximize-minimize",
  "domains/window/window-tools",
  "domains/window/window-quick-switch",
  "domains/window/window-rectangle",
  "domains/window/window-app-switch",
  "domains/window/window-virtual-desktops",
  "domains/taskbar/taskbar-core",
  "domains/taskbar/taskbar-center",
  "domains/taskbar/taskbar-hidden",
  "domains/taskbar/taskbar-pin",
  "domains/taskbar/taskbar-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["AI🧙‍♂️", "scillidan🤡"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
arboard = "3"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
] }
tray-icon = "0.20"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
