# desktop-tools — suite host, editor and plugin enable list.
# config/core.toml is created from this file on first run.

[host]
start_with_windows = false
log_level = "info"
tray = "host"

# Empty = EDITOR, then VISUAL, then notepad.
[editor]
command = ""

[plugins]
enabled = [
  "window-tools",
  "screen-tools",
  "taskbar-tools",
  "keyboard-keymap",
  "keyboard-auto-switch-back",
  "keyboard-locker",
  "keyboard-switch",
  "keyboard-shell",
  "goldendict-auto-search",
  "goldendict-search-in-group",
]
